# Mutation testing config. Run with: bundle exec mutant run
#
# Mutant rewrites the source in small ways (flip a boolean, drop a call, swap
# an operator) and reruns the specs. A mutation that survives is a line the
# suite does not actually check - which is how `transaction_time` and the
# seconds/milliseconds mix-up went unnoticed under 100% line coverage.
# This repository is public and MIT-licensed, which is what mutant's free
# opensource usage type requires. A private or commercial code base needs a
# paid licence instead.
usage: opensource

integration:
  name: rspec
requires:
  - tappay
matcher:
  subjects:
    - Tappay::Transaction::Query*
    - Tappay::Response*
# Current score: 85.46% (447/523 killed). The remainder is dominated by
# equivalent mutations mutant cannot kill - `Client` vs `Tappay::Client` inside
# module Tappay, `is_a?` vs `instance_of?`, `to_i` vs `Integer()` on a string
# that is always numeric. Chasing 100% here buys contrived tests, not safety.
coverage_criteria:
  test_result: true
  timeout: false
  process_abort: true
