# Mutation testing config. Run with: bundle exec mutant run
#
# Mutant rewrites the source in small ways (flip a boolean, drop a call, swap
# an operator) and reruns the specs. A mutation that survives is a line the
# suite does not actually check - which is how `transaction_time` and the
# seconds/milliseconds mix-up went unnoticed under 100% line coverage.
# This repository is public and MIT-licensed, which is what mutant's free
# opensource usage type requires. A private or commercial code base needs a
# paid licence instead.
usage: opensource

integration:
  name: rspec
requires:
  - tappay
matcher:
  subjects:
    - Tappay::Transaction::Query*
    - Tappay::Response*
    - Tappay::PrimePayment*
    - Tappay::RedirectPayment*
# Current score: 95.34% (676/709 killed). Every one of the 33 survivors has
# been checked individually and is equivalent - the mutated code behaves
# identically, so no test can distinguish it:
#
#  14  time[k] -> time.fetch(k)   the option is required, so the key is present
#   7  Tappay::X -> X             same constant inside module Tappay
#   4  is_a? -> instance_of?      differs only for a subclass nothing passes
#   4  strip -> lstrip/rstrip     the check is .empty?, and a string that is
#                                 whitespace-only is empty after all three
#   2  to_s -> to_str             identical for the Strings that reach it
#   1  parsed_response[k] -> self[k]   Response#[] delegates to exactly that
#   1  code.to_i -> Integer(code)      differs only for a non-numeric HTTP code
#
# If this number drops, a real assertion went missing. Re-check the list before
# assuming a new survivor is more of the same - the first run scored 77.90% and
# every one of those 116 survivors turned out to be genuine.

coverage_criteria:
  test_result: true
  timeout: false
  process_abort: true
